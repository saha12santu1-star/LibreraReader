- name: Create temporary Google Services configuration
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          config = {
              "project_info": {
                  "project_number": "123456789012",
                  "project_id": "librera-ci-placeholder"
              },
              "client": [{
                  "client_info": {
                      "mobilesdk_app_id":
                          "1:123456789012:android:0000000000000000",
                      "android_client_info": {
                          "package_name": "com.foobnix.pdf.reader"
                      }
                  },
                  "api_key": [{
                      "current_key": "placeholder-api-key"
                  }]
              }],
              "configuration_version": "1"
          }

          paths = [
              "app/src/fdroidDebug/google-services.json",
              "app/src/fdroid/debug/google-services.json",
              "app/src/debug/fdroid/google-services.json",
              "app/src/fdroid/google-services.json",
              "app/src/debug/google-services.json",
              "app/google-services.json"
          ]

          for item in paths:
              path = Path(item)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(json.dumps(config, indent=2))
              print(f"Created {path}")
          PY
