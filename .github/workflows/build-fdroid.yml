
name: Build Librera with Drive Sync

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Android SDK components
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/27.2.12479018
            /usr/local/lib/android/sdk/platforms/android-36
          key: android-sdk-${{ runner.os }}-ndk27.2.12479018-api36-v1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git make pkg-config \
            python3 python-is-python3 zip \
            mesa-common-dev libxcursor-dev \
            libxrandr-dev libxinerama-dev \
            libglu1-mesa-dev libxi-dev libgl-dev

      - name: Install Android SDK platform and NDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" \
            "ndk;27.2.12479018"

      - name: Configure Google Drive credentials
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          LIBRERA_APP_GDRIVE_KEY: ${{ secrets.LIBRERA_APP_GDRIVE_KEY }}
        run: |
          set -eu

          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Add the GOOGLE_SERVICES_JSON repository secret."
            exit 1
          fi

          if [ -z "$LIBRERA_APP_GDRIVE_KEY" ]; then
            echo "::error::Add the LIBRERA_APP_GDRIVE_KEY repository secret."
            exit 1
          fi

          printf '%s' "$GOOGLE_SERVICES_JSON" \
            > app/google-services.json

          mkdir -p "$HOME/.gradle"

          cat >> "$HOME/.gradle/gradle.properties" <<EOF
          librera_appGdriveKey=$LIBRERA_APP_GDRIVE_KEY
          librera_ndk_dir=$ANDROID_HOME/ndk/27.2.12479018
          librera_admobAppId=
          librera_admobBannerId=
          librera_admobFullId=
          librera_admobRewardId=
          pro_appGdriveKey=
          pdf_classic_appGdriveKey=
          pdf_classic_admobAppId=
          pdf_classic_admobBannerId=
          pdf_classic_admobFullId=
          pdf_classic_admobRewardId=
          ebooka_appGdriveKey=
          ebooka_admobAppId=
          ebooka_admobBannerId=
          ebooka_admobFullId=
          ebooka_admobRewardId=
          pdf_v2_appGdriveKey=
          pdf_v2_admobAppId=
          pdf_v2_admobBannerId=
          pdf_v2_admobFullId=
          pdf_v2_admobRewardId=
          tts_reader_appGdriveKey=
          tts_reader_admobAppId=
          tts_reader_admobBannerId=
          tts_reader_admobFullId=
          tts_reader_admobRewardId=
          epub_reader_appGdriveKey=
          epub_reader_admobAppId=
          epub_reader_admobBannerId=
          epub_reader_admobFullId=
          epub_reader_admobRewardId=
          EOF

      - name: Make release signing conditional
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path("app/build.gradle")
          text = path.read_text()

          pattern = (
              r'(?s)    signingConfigs\s*\{\s*release\s*\{'
              r'\s*storeFile file\(RELEASE_STORE_FILE\)'
              r'\s*storePassword RELEASE_STORE_PASSWORD'
              r'\s*keyAlias RELEASE_KEY_ALIAS'
              r'\s*keyPassword RELEASE_KEY_PASSWORD'
              r'\s*\}\s*\}'
          )

          replacement = """    signingConfigs {
              release {
                  if (project.hasProperty('RELEASE_STORE_FILE')) {
                      storeFile file(RELEASE_STORE_FILE)
                      storePassword RELEASE_STORE_PASSWORD
                      keyAlias RELEASE_KEY_ALIAS
                      keyPassword RELEASE_KEY_PASSWORD
                  }
              }
          }"""

          updated, count = re.subn(pattern, replacement, text, count=1)
          if count != 1:
              raise SystemExit(
                  "Could not locate release signing configuration."
              )

          path.write_text(updated)
          print("Release signing configuration updated.")
          PY

      - name: Restrict APKs to ARM and ARM64
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path("app/build.gradle")
          text = path.read_text()

          pattern = (
              r'(?s)splits\s*\{\s*abi\s*\{\s*'
              r'enable\s*=\s*true\s*'
              r'reset\(\)\s*'
              r'include\s+"x86",\s*"x86_64",\s*'
              r'"armeabi-v7a",\s*"arm64-v8a"\s*'
              r'universalApk\s*=\s*true\s*'
              r'\}\s*\}'
          )

          replacement = """splits {
              abi {
                  enable = true
                  reset()
                  include "armeabi-v7a", "arm64-v8a"
                  universalApk = false
              }
          }"""

          updated, count = re.subn(
              pattern, replacement, text, count=1
          )

          if count != 1:
              raise SystemExit(
                  "Original ABI configuration did not match."
              )

          path.write_text(updated)
          print("Only ARM and ARM64 APKs enabled.")
          PY

      - name: Prepare fonts and MuPDF
        run: |
          cd Builder
          chmod +x fonts.sh link_to_mupdf_1.28.5.sh
          ./fonts.sh
          ./link_to_mupdf_1.28.5.sh fdroid

      - name: Build regular Librera variant
        run: |
          ./gradlew assembleLibreraDebug \
            --build-cache \
            -Pmupdf=1.28.5

      - name: Verify exactly two APKs
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="app/build/outputs/apk/librera/debug"

          if [ ! -d "$APK_DIR" ]; then
            echo "Expected output directory not found: $APK_DIR"
            find app/build/outputs/apk -type f -name '*.apk' || true
            exit 1
          fi

          mapfile -t APKS < <(
            find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' | sort
          )

          if [ "${#APKS[@]}" -ne 2 ]; then
            echo "Expected exactly two APKs; found ${#APKS[@]}"
            printf '%s\n' "${APKS[@]}"
            exit 1
          fi

          printf '%s\n' "${APKS[@]}" | grep -q -- '-arm.apk$'
          printf '%s\n' "${APKS[@]}" | grep -q -- '-arm64.apk$'

          printf '%s\n' "${APKS[@]}"

      - name: Upload ARM and ARM64 APKs
        uses: actions/upload-artifact@v4
        with:
          name: Librera-Regular-ARM-ARM64
          path: |
            app/build/outputs/apk/librera/debug/*-arm.apk
            app/build/outputs/apk/librera/debug/*-arm64.apk
          if-no-files-found: error
          retention-days: 7
